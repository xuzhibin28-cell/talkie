<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1b242e"/>
      <stop offset="100%" stop-color="#090c0f"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a333d"/>
      <stop offset="50%" stop-color="#171e26"/>
      <stop offset="100%" stop-color="#0f1419"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00a844"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#2b3642" stroke-width="6"/>

  <!-- Antenna -->
  <path d="M168 50 L168 140 L198 140 L198 50 Z" fill="#3a4552" stroke="#10151a" stroke-width="4"/>
  <circle cx="183" cy="48" r="14" fill="#00e676" filter="url(#neonGlow)"/>

  <!-- Top Volume/Power Knob -->
  <rect x="320" y="70" width="44" height="70" rx="8" fill="#202730" stroke="#10151a" stroke-width="4"/>
  <line x1="332" y1="85" x2="332" y2="125" stroke="#4a5563" stroke-width="3"/>
  <line x1="342" y1="85" x2="342" y2="125" stroke="#4a5563" stroke-width="3"/>
  <line x1="352" y1="85" x2="352" y2="125" stroke="#4a5563" stroke-width="3"/>

  <!-- Main Radio Body -->
  <rect x="110" y="130" width="292" height="330" rx="42" fill="url(#bodyGrad)" stroke="#3d4957" stroke-width="6"/>

  <!-- Display Screen -->
  <rect x="145" y="165" width="222" height="75" rx="12" fill="#06080a" stroke="#222b35" stroke-width="4"/>
  
  <!-- Screen Elements -->
  <circle cx="168" cy="188" r="5" fill="#00e676" filter="url(#neonGlow)"/>
  <text x="185" y="193" fill="#00e676" font-family="'Courier New', monospace" font-size="16" font-weight="bold">CH: ALPHA-1</text>
  <text x="165" y="224" fill="#687787" font-family="'Courier New', monospace" font-size="13">SIGNAL: OPTIMAL</text>
  <rect x="315" y="212" width="40" height="12" rx="2" fill="none" stroke="#00e676" stroke-width="2"/>
  <rect x="318" y="215" width="26" height="6" rx="1" fill="#00e676"/>

  <!-- Giant PTT Button Center -->
  <circle cx="256" cy="335" r="76" fill="#12171d" stroke="#2e3845" stroke-width="8"/>
  <circle cx="256" cy="335" r="62" fill="url(#glowGrad)" filter="url(#neonGlow)"/>
  
  <!-- Microphone Icon on PTT -->
  <path d="M256 305 C247.16 305 240 312.16 240 321 L240 338 C240 346.84 247.16 354 256 354 C264.84 354 272 346.84 272 338 L272 321 C272 312.16 264.84 305 256 305 Z" fill="#06120b"/>
  <path d="M232 328 C232 341.25 242.75 352 256 352 C269.25 352 280 341.25 280 328" fill="none" stroke="#06120b" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="352" x2="256" y2="365" stroke="#06120b" stroke-width="5" stroke-linecap="round"/>
  <line x1="244" y1="365" x2="268" y2="365" stroke="#06120b" stroke-width="5" stroke-linecap="round"/>

  <!-- Speaker Grill Dots Bottom -->
  <circle cx="220" cy="430" r="4" fill="#2b3540"/>
  <circle cx="238" cy="430" r="4" fill="#2b3540"/>
  <circle cx="256" cy="430" r="4" fill="#2b3540"/>
  <circle cx="274" cy="430" r="4" fill="#2b3540"/>
  <circle cx="292" cy="430" r="4" fill="#2b3540"/>
</svg>
